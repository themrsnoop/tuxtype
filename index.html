<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tuxtype</title>

    <!-- I suppose it'd be easier/cleaner to split styling across multiple css files -->
    <link rel="stylesheet" href="CSS/index.css">
    <link rel="stylesheet" href="CSS/navbar.css">
    <link rel="stylesheet" href="CSS/postgame.css">
    <link rel="icon" href="Recources/Branding/tuxascii.png">
</head>
<body>
    <div id="Navbar">
        <a href="index.html" class="Nav"><p>>/TUXTYPE</p></a>
        <div class="vr"></div>
        <div class="line"></div>
        <button class="Nav"><p>KERNEL</p></button>
        <button class="Nav"><p>ARCH</p><div id="selectedDistro"></div></button>
        <button class="Nav"><p>FEDORA</p></button>
        <button class="Nav"><p>DEBIAN</p></button>
        <!-- stinky no lifers -->
        <button class="Nav"><p>NIXOS</p></button>
        <button class="Nav"><p>GENTOO</p></button>
        <button class="Nav"><p>BSD</p></button>
    </div>

    <div id="completionContainer">
        <div class="completionContent">
            <div class="stats">
                <h2 id="finalWPM">WPM=50</h2>
                <div class="subStats">
                    <h3 id="finalCPM">CPM:200</h3>
                    <h3 id="finalCMD">CMDs:15</h3>
                    <h4 id="distroMode">Distro-Mode=Arch</h4>
                </div>

            </div>
            <div class="graphContainer">
                <h1 class="yAxis">WPM</h1>
                <h1 class="xAxis">TIME(S)</h1>
                <canvas id="graph"></canvas>
                <div id="timeIntervals"></div>
            </div>
        </div>
    </div>

    <div id="caret" class="blink"></div>
    <div id="caret_ghost" class="blink"></div>

    <div class="TypeContainer">
        <div class="ExtrasContainer">
            <div class="Clock"><p id="Clock">45:00 </p></div>
            <div><p id="cmds">cmds: 0 </p></div>
            <div><p id="cpm">cpm: 0 </p></div>
            <div class="wpm"><p id="wpm">wpm: 0</p></div>
        </div>
        <div class="WordContainer">
            <!--just a normal span-->
            <span class="immovableForce">tux@linux:~$</span>
            <div id="letterContainer"></div>
        </div>
        <div class = "MeaningContainer">
            <div class = "Meaning"><p id="Meaning">placeholder</p>
        </div>
    </div>

    <script type = "module" src="JS/timer.js"></script>
    <script type="module" src="JS/tick.js"></script>
    <script type = "module" src="JS/characters.js"></script>
    <script type="module" src="JS/endgame.js"></script>
</body>
</html>
